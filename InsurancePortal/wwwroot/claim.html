<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Claims - Greenstone Insurance</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        :root {
            --green-dark: #1a3a2a;
            --gold: #c9a84c;
        }
        .header-logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: #1a3a2a;
            letter-spacing: -0.5px;
        }

        .sidebar {
            background-color: #2e7d32 !important;
        }

        .sidebar a {
            color: white !important;
        }

        .sidebar h3 {
            color: white !important;
        }

        .header-logo span { color: #c9a84c; }

        .claim-form {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            max-width: 600px;
            margin-bottom: 30px;
        }
        .claim-form h2 {
            font-family: 'Playfair Display', serif;
            color: #1a3a2a;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 2px solid #e8f5e9;
            padding-bottom: 10px;
        }
        .form-group { margin: 15px 0; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.2s;
            font-family: inherit;
        }
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2e7d32;
        }
        .form-group textarea { height: 100px; resize: vertical; }

        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            background: #fafafa;
        }
        .upload-area:hover { border-color: #2e7d32; background: #e8f5e9; }
        .upload-area.has-file { border-color: #2e7d32; background: #e8f5e9; }
        .upload-area p { color: #666; font-size: 14px; margin: 8px 0 0; }
        .upload-area .icon { font-size: 32px; }

        #photoPreview {
            margin-top: 12px;
            display: none;
        }
        #photoPreview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .btn-step {
            padding: 12px 28px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-step:hover {
            background: #1a3a2a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46,125,50,0.3);
        }

        .claims-list { max-width: 600px; }
        .claim-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-left: 4px solid #2e7d32;
            margin-bottom: 15px;
        }
        .claim-card h3 { color: #1a3a2a; margin-bottom: 8px; }
        .claim-card p { font-size: 14px; color: #555; margin: 4px 0; }
        .claim-card img {
            margin-top: 10px;
            max-width: 100%;
            max-height: 150px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-pending { background: #fff3e0; color: #e65100; }
        .badge-approved { background: #e8f5e9; color: #2e7d32; }
        .badge-rejected { background: #ffebee; color: #c62828; }
        .empty-msg { color: #999; font-size: 14px; padding: 20px 0; }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: #1a3a2a;
            margin: 30px 0 15px;
        }
    </style>
</head>
<body>

<header>
    <div class="header-logo">Greenstone <span>Insurance</span></div>
    <nav>
        
        <span id="headerName" style="color:#1a1a1a; font-weight:bold; margin-right:15px;"></span>

        <a href="/login.html" class="btn" onclick="logout()">Logout</a>
    </nav>
</header>

<div class="dashboard">
    <div class="sidebar">
        <h3>Menu</h3>
        <a href="/dashboard.html">🏠 Dashboard</a>
        <a href="/policy.html">📋 My Policies</a>
        <a href="/claim.html">🔧 Submit Claim</a>
        <a href="/payment.html">💳 Payments</a>
        <a href="/profile.html">👤 Profile</a>
        <a href="/login.html" onclick="logout()" class="btn-primary" style="margin-top:20px;">Logout</a>
    </div>

    <div class="main-content">
        <div class="claim-form">
            <h2>🔧 Submit a Claim</h2>

            <div class="form-group">
                <label>Select Policy</label>
                <select id="policyId">
                    <option value="">-- Select a policy --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Claim Description</label>
                <textarea id="description" placeholder="Describe what happened in detail..."></textarea>
            </div>

            <div class="form-group">
                <label>Upload Photo (optional)</label>
                <div class="upload-area" onclick="document.getElementById('photoInput').click()">
                    <div class="icon">📷</div>
                    <p id="uploadText">Click to upload a photo of the incident</p>
                </div>
                <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="previewPhoto()">
                <div id="photoPreview">
                    <img id="previewImg" src="" alt="Preview">
                </div>
            </div>

            <button class="btn-step" onclick="submitClaim()">Submit Claim →</button>
        </div>

        <h2 class="section-title">Your Claims</h2>
        <div class="claims-list" id="claimsList">
            <p class="empty-msg">Loading...</p>
        </div>
    </div>
</div>

<script>

    const userId = localStorage.getItem("userId");
    const userName = localStorage.getItem("userFullName");
    const isAdmin = localStorage.getItem("isAdmin");

    if (!userId) window.location.href = "/login.html";
    if (isAdmin === "true") window.location.href = "/admin-dashboard.html";

    const API = "http://localhost:5077";

    async function loadPolicies() {
        const response = await fetch(`${API}/api/policy/${userId}`);
        const policies = await response.json();
        const select = document.getElementById("policyId");

        if (policies.length === 0) {
            select.innerHTML = "<option value=''>No active policies found</option>";
            return;
        }

        policies.forEach(p => {
            select.innerHTML += `<option value="${p.id}">${p.planType} - ${p.carModel} (${p.carPlate})</option>`;
        });
    }

    function previewPhoto() {
        const file = document.getElementById("photoInput").files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById("previewImg").src = e.target.result;
            document.getElementById("photoPreview").style.display = "block";
            document.getElementById("uploadText").textContent = `📎 ${file.name}`;
            document.querySelector(".upload-area").classList.add("has-file");
        };
        reader.readAsDataURL(file);
    }

    async function submitClaim() {
        const policyId = document.getElementById("policyId").value;
        const description = document.getElementById("description").value;
        const photoFile = document.getElementById("photoInput").files[0];

        if (!policyId) { alert("Please select a policy."); return; }
        if (!description) { alert("Please describe what happened."); return; }

        const formData = new FormData();
        formData.append("userId", userId);
        formData.append("policyId", policyId);
        formData.append("description", description);
        if (photoFile) formData.append("photo", photoFile);

        try {
            const response = await fetch(`${API}/api/claim/submit`, {
                method: "POST",
                body: formData
            });

            if (response.ok) {
                alert("✅ Claim submitted successfully!");
                document.getElementById("policyId").value = "";
                document.getElementById("description").value = "";
                document.getElementById("photoInput").value = "";
                document.getElementById("photoPreview").style.display = "none";
                document.getElementById("uploadText").textContent = "Click to upload a photo of the incident";
                document.querySelector(".upload-area").classList.remove("has-file");
                loadClaims();
            } else {
                alert("Error submitting claim. Please try again.");
            }
        } catch (error) {
            console.error(error);
            alert("Error connecting to server.");
        }
    }

    async function loadClaims() {
        const response = await fetch(`${API}/api/claim/user/${userId}`);
        const claims = await response.json();
        const list = document.getElementById("claimsList");
        list.innerHTML = "";

        if (claims.length === 0) {
            list.innerHTML = "<p class='empty-msg'>No claims submitted yet.</p>";
            return;
        }

        claims.forEach(c => {
            const statusColor = c.status === "Pending" ? "badge-pending" : c.status === "Approved" ? "badge-approved" : "badge-rejected";
            list.innerHTML += `
                <div class="claim-card">
                    <h3>Claim #${c.id}</h3>
                    <p>📝 ${c.description}</p>
                    <p>📅 ${new Date(c.date).toLocaleDateString()}</p>
                    <span class="badge ${statusColor}">${c.status}</span>
                    ${c.photoPath ? `<br><img src="${API}${c.photoPath}" alt="Claim photo">` : ""}
                </div>`;
        });
    }

    function logout() {
        localStorage.clear();
        window.location.href = "/login.html";
    }

    loadPolicies();
    loadClaims();
</script>

</body>
</html>
