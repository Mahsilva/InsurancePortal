<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Greenstone Insurance</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        :root {
            --green-dark: #1a3a2a;
            --green-mid: #2e7d32;
            --gold: #c9a84c;
        }


                .sidebar {
            background-color: #2e7d32 !important;
        }

        .sidebar a {
            color: white !important;
        }

        .sidebar h3 {
            color: white !important;
        }

        .header-logo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: #1a3a2a;
            letter-spacing: -0.5px;
        }



        .header-logo span { color: #c9a84c; }

        .profile-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            max-width: 600px;
        }

        .profile-card h2 {
            font-family: 'Playfair Display', serif;
            color: #1a3a2a;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 2px solid #e8f5e9;
            padding-bottom: 10px;
        }

        .profile-info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .profile-info-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .profile-info-item .label {
            font-size: 13px;
            color: #666;
            font-weight: 600;
            min-width: 80px;
        }

        .profile-info-item .value {
            font-size: 15px;
            color: #1a1a1a;
            font-weight: 500;
        }

        .form-group {
            margin: 15px 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        .form-group input {
            width: 100%;
            max-width: 400px;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2e7d32;
        }

        .btn-step {
            padding: 12px 28px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-step:hover {
            background: #1a3a2a;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(46,125,50,0.3);
        }

        .success-msg {
            display: none;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 500;
        }

        .error-msg {
            display: none;
            background: #ffebee;
            color: #c62828;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<header>
    <div class="header-logo">Greenstone <span>Insurance</span></div>
    <nav>
        
        <span id="headerName" style="color:#1a1a1a; font-weight:bold; margin-right:15px;"></span>
        <a href="/login.html" class="btn" onclick="logout()">Logout</a>
    </nav>
</header>

<div class="dashboard">
    <div class="sidebar">
        <h3>Menu</h3>
        <a href="/dashboard.html">🏠 Dashboard</a>
        <a href="/policy.html">📋 My Policies</a>
        <a href="/claim.html">🔧 Submit Claim</a>
        <a href="/payment.html">💳 Payments</a>
        <a href="/profile.html">👤 Profile</a>
        <a href="/login.html" onclick="logout()" class="btn-primary" style="margin-top:20px;">Logout</a>
    </div>

    <div class="main-content">
        <h1>Your Profile</h1>

        <!-- Informações do perfil -->
        <div class="profile-card">
            <h2>👤 Personal Information</h2>
            <div class="profile-info">
                <div class="profile-info-item">
                    <span class="label">Name</span>
                    <span class="value" id="name">Loading...</span>
                </div>
                <div class="profile-info-item">
                    <span class="label">Email</span>
                    <span class="value" id="email">Loading...</span>
                </div>
            </div>
        </div>

        <!-- Alterar senha -->
        <div class="profile-card">
            <h2>🔒 Change Password</h2>

            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="currentPassword" placeholder="Enter current password">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password">
            </div>

            <button class="btn-step" onclick="changePassword()">🔒 Update Password</button>

            <div class="success-msg" id="successMsg">✅ Password updated successfully!</div>
            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>
</div>

<script>
    
    const userId = localStorage.getItem("userId");
    const userName = localStorage.getItem("userFullName");
    const userEmail = localStorage.getItem("userEmail");
    const isAdmin = localStorage.getItem("isAdmin");

    if (!userId) window.location.href = "/login.html";
    if (isAdmin === "true") window.location.href = "/admin-dashboard.html";

    document.getElementById("name").textContent = userName || "Not available";
    document.getElementById("email").textContent = userEmail || "Not available";
    document.getElementById("headerName").textContent = userName || "";

    const API = "https://insuranceportal-production-b15d.up.railway.app";

    async function changePassword() {
        const currentPassword = document.getElementById("currentPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        const errorMsg = document.getElementById("errorMsg");
        const successMsg = document.getElementById("successMsg");

        errorMsg.style.display = "none";
        successMsg.style.display = "none";

        if (!currentPassword || !newPassword || !confirmPassword) {
            errorMsg.textContent = "❌ Please fill in all fields.";
            errorMsg.style.display = "block";
            return;
        }

        if (newPassword !== confirmPassword) {
            errorMsg.textContent = "❌ New passwords do not match.";
            errorMsg.style.display = "block";
            return;
        }

        if (newPassword.length < 4) {
            errorMsg.textContent = "❌ New password must be at least 4 characters.";
            errorMsg.style.display = "block";
            return;
        }

        try {
            const response = await fetch(`${API}/api/auth/change-password`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    userId: parseInt(userId),
                    currentPassword,
                    newPassword
                })
            });

            if (response.ok) {
                successMsg.style.display = "block";
                document.getElementById("currentPassword").value = "";
                document.getElementById("newPassword").value = "";
                document.getElementById("confirmPassword").value = "";
            } else {
                const error = await response.text();
                errorMsg.textContent = `❌ ${error}`;
                errorMsg.style.display = "block";
            }
        } catch (error) {
            errorMsg.textContent = "❌ Error connecting to server.";
            errorMsg.style.display = "block";
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = "/login.html";
    }
</script>

</body>
</html>
